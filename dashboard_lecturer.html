<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Portal - Mental Support</title>
    <link rel="stylesheet" href="css/styles.css?v=32">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            Lecturer Portal
        </div>
        <div style="display: flex; align-items: center; gap: 16px; position: relative;">
            <button class="btn-secondary" onclick="goBackStep()">&larr; Back</button>
            <button class="btn-secondary" onclick="handleLogout()">Log Out</button>
        </div>
    </header>

    <!-- Main Grid -->
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <div class="glass-card sidebar">
            <div class="sidebar-profile">
                <div class="avatar-placeholder" id="avatarLetter">L</div>
                <h3 id="userGreeting" style="font-weight: 700;">Lecturer User</h3>
                <span style="font-size: 12px; color: var(--primary);" id="lecturerDept">Academic Dept</span>
                <span id="userUniversity" style="font-size: 11px; color: var(--text-secondary); display: block; margin-top: 4px;"></span>
                <div style="margin-top: 12px;">
                    <label class="btn-secondary" style="cursor: pointer; padding: 6px 12px; font-size: 12px;">
                        Upload Profile Picture
                        <input type="file" id="avatarUpload" accept="image/*" style="display: none;" onchange="handleAvatarUpload(event)">
                    </label>
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="sidebar-link active" data-tab="studentsProgressTab">Student Progress</div>
                <div class="sidebar-link" data-tab="settingsTab">Settings</div>
            </div>
        </div>

        <!-- Contents View -->
        <div class="dashboard-content">
            
            <!-- STUDENT PROGRESS TAB -->
            <div id="studentsProgressTab" class="tab-content active">
                <h2 style="font-size: 28px; font-weight: 700; margin-bottom: 8px;">Student Wellness &amp; Progress</h2>
                <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 14px;">View and manage students registered under your university.</p>
                
                <div style="margin-bottom: 20px;">
                    <input type="text" id="studentProgressSearch" placeholder="Search by student name, ID or department..." class="form-control" style="max-width: 380px;" oninput="filterLecturerStudents()">
                </div>

                <div class="glass-card" style="padding: 20px;">
                    <div id="lecturerStudentsList">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>

            <!-- SETTINGS TAB -->
            <div id="settingsTab" class="tab-content">
                <h2 style="font-size: 28px; font-weight: 700; margin-bottom: 24px;">Account Settings</h2>
                
                <div class="glass-card" style="max-width: 500px; padding: 24px;">
                    <h3 style="margin-bottom: 20px; font-weight: 600;">Change Password</h3>
                    <form onsubmit="handleSettingsPasswordUpdate(event)">
                        <div class="form-group" style="margin-bottom: 16px;">
                            <label class="form-label" style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px;">Current Password</label>
                            <input type="password" name="current_password" required placeholder="••••••••" class="form-control">
                        </div>
                        <div class="form-group" style="margin-bottom: 16px;">
                            <label class="form-label" style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px;">New Password</label>
                            <input type="password" name="new_password" required placeholder="••••••••" class="form-control">
                        </div>
                        <div class="form-group" style="margin-bottom: 20px;">
                            <label class="form-label" style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px;">Confirm New Password</label>
                            <input type="password" name="confirm_new_password" required placeholder="••••••••" class="form-control">
                        </div>
                        <button type="submit" class="btn-primary">Update Password</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- STUDENT HEALTH DETAILS AUDIT MODAL -->
    <div class="modal-overlay" id="studentAuditModal">
        <div class="glass-card modal-content" style="max-width: 600px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h2 style="font-weight: 700; color: var(--primary);">Student Wellness Report</h2>
                <span class="modal-close" onclick="closeModal('studentAuditModal')">&times;</span>
            </div>
            <div id="studentAuditDetails">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Site Footer -->
    <footer style="
        background: var(--glass-bg);
        border-top: 1px solid var(--glass-border);
        padding: 14px 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: var(--text-muted);
    ">
        <a href="docs/user_manual.html" style="
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 7px 18px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
        " onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            User Manual
        </a>
    </footer>

    <script src="js/app.js?v=51"></script>
    <script src="js/ai_chatbot_ui.js?v=2"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            initLecturerDashboard();
        });
    </script>
</body>
</html>
